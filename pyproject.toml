[project]
name = "{{PROJECT_NAME}}"
version = "0.1.0"
description = "{{PROJECT_DESCRIPTION}}"
authors = [
    {name = "{{AUTHOR_NAME}}", email = "{{AUTHOR_EMAIL}}"}
]
readme = "README.md"
requires-python = ">=3.9,<3.14"
dependencies = [
    "coloredlogs>=15.0.1",
    "colorlog>=6.8.0",
    "torch>=2.8.0,<3.0.0",
    "torchvision>=0.23.0,<0.24.0",
]

[tool.poetry]
packages = [{include = "{{PACKAGE_NAME}}", from = "src"}]

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.30.1"
pytest = "^8.4.2"
pytest-cov = "^7.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra --cov={{PACKAGE_NAME}} --cov-report=term-missing"
testpaths = [
    "tests",
]
pythonpath = [
    "src",
]
